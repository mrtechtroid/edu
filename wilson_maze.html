<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wilson's Maze Algorithm with Pathfinding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            gap: 20px;
            min-height: 100vh;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 300px;
            height: fit-content;
        }
        
        .canvas-container {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
        }
        
        h2 {
            font-size: 16px;
            margin: 20px 0 10px 0;
            color: #555;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="number"],
        input[type="range"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        input[type="range"] {
            padding: 0;
        }
        
        .range-value {
            text-align: right;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        
        button.primary {
            background: #2563eb;
            color: white;
        }
        
        button.primary:hover {
            background: #1d4ed8;
        }
        
        button.secondary {
            background: #10b981;
            color: white;
        }
        
        button.secondary:hover {
            background: #059669;
        }
        
        button.tertiary {
            background: #e5e7eb;
            color: #333;
        }
        
        button.tertiary:hover {
            background: #d1d5db;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        canvas {
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            cursor: crosshair;
        }
        
        .color-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        input[type="color"] {
            width: 50px;
            height: 32px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
        
        .mode-indicator {
            padding: 8px 12px;
            background: #f3f4f6;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .mode-indicator.active {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h1>Wilson's Algorithm</h1>
        
        <div class="control-group">
            <label>Grid Size</label>
            <input type="number" id="gridSize" value="20" min="5" max="100">
        </div>
        
        <div class="control-group">
            <label>Cell Size</label>
            <input type="range" id="cellSize" value="20" min="5" max="50">
            <div class="range-value"><span id="cellSizeValue">20</span>px</div>
        </div>
        
        <div class="control-group">
            <label>Animation Speed</label>
            <select id="speed">
                <option value="0">Instant</option>
                <option value="100">Very Fast</option>
                <option value="50" selected>Fast</option>
                <option value="20">Normal</option>
                <option value="5">Slow</option>
            </select>
        </div>
        
        <button class="primary" id="generateBtn">Generate Maze</button>
        
        <h2>Entrance & Exit</h2>
        
        <div class="mode-indicator" id="modeIndicator">Click on maze to set points</div>
        
        <button class="secondary" id="setEntranceBtn">Set Entrance</button>
        <button class="secondary" id="setExitBtn">Set Exit</button>
        <button class="tertiary" id="clearPointsBtn">Clear Points</button>
        
        <h2>Pathfinding</h2>
        
        <div class="control-group">
            <label>Algorithm</label>
            <select id="algorithm">
                <option value="astar">A* (Optimal)</option>
                <option value="dijkstra">Dijkstra</option>
                <option value="bfs">BFS</option>
            </select>
        </div>
        
        <button class="secondary" id="findPathBtn">Find Path</button>
        <button class="tertiary" id="clearPathBtn">Clear Path</button>
        
        <h2>Colors</h2>
        
        <div class="control-group">
            <label>Wall Color</label>
            <div class="color-input">
                <input type="color" id="wallColor" value="#000000">
            </div>
        </div>
        
        <div class="control-group">
            <label>Path Color</label>
            <div class="color-input">
                <input type="color" id="pathColor" value="#ffffff">
            </div>
        </div>
        
        <div class="control-group">
            <label>Current Path Color</label>
            <div class="color-input">
                <input type="color" id="currentColor" value="#3b82f6">
            </div>
        </div>
        
        <div class="control-group">
            <label>Solution Path Color</label>
            <div class="color-input">
                <input type="color" id="solutionColor" value="#10b981">
            </div>
        </div>
        
        <div class="control-group">
            <label>Entrance Color</label>
            <div class="color-input">
                <input type="color" id="entranceColor" value="#22c55e">
            </div>
        </div>
        
        <div class="control-group">
            <label>Exit Color</label>
            <div class="color-input">
                <input type="color" id="exitColor" value="#ef4444">
            </div>
        </div>
        
        <button class="tertiary" id="exportBtn">Export as Matrix</button>
    </div>
    
    <div class="canvas-container">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        
        let gridSize = 20;
        let cellSize = 20;
        let animationSpeed = 50;
        let maze = [];
        let isGenerating = false;
        
        // Entrance and exit points
        let entrance = null;
        let exit = null;
        let settingMode = null; // 'entrance' or 'exit'
        let solutionPath = [];
        
        // Color settings
        let wallColor = '#000000';
        let pathColor = '#ffffff';
        let currentColor = '#3b82f6';
        let solutionColor = '#10b981';
        let entranceColor = '#22c55e';
        let exitColor = '#ef4444';
        
        // Directions: [row, col]
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        
        // Initialize maze grid
        function initMaze() {
            maze = Array(gridSize).fill().map(() => 
                Array(gridSize).fill().map(() => ({
                    visited: false,
                    walls: [true, true, true, true] // top, right, bottom, left
                }))
            );
            entrance = null;
            exit = null;
            solutionPath = [];
        }
        
        // Set up canvas
        function setupCanvas() {
            const size = gridSize * cellSize;
            canvas.width = size;
            canvas.height = size;
            ctx.fillStyle = pathColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Draw the maze
        function drawMaze(currentPath = []) {
            ctx.fillStyle = pathColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw solution path
            if (solutionPath.length > 0) {
                ctx.fillStyle = solutionColor;
                for (const [r, c] of solutionPath) {
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
            
            // Draw current path (during generation)
            if (currentPath.length > 0) {
                ctx.fillStyle = currentColor;
                for (const [r, c] of currentPath) {
                    ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                }
            }
            
            // Draw entrance
            if (entrance) {
                ctx.fillStyle = entranceColor;
                ctx.fillRect(entrance.c * cellSize, entrance.r * cellSize, cellSize, cellSize);
                ctx.fillStyle = '#fff';
                ctx.font = `${cellSize * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', entrance.c * cellSize + cellSize / 2, entrance.r * cellSize + cellSize / 2);
            }
            
            // Draw exit
            if (exit) {
                ctx.fillStyle = exitColor;
                ctx.fillRect(exit.c * cellSize, exit.r * cellSize, cellSize, cellSize);
                ctx.fillStyle = '#fff';
                ctx.font = `${cellSize * 0.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', exit.c * cellSize + cellSize / 2, exit.r * cellSize + cellSize / 2);
            }
            
            // Draw walls
            ctx.strokeStyle = wallColor;
            ctx.lineWidth = 2;
            
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = maze[r][c];
                    const x = c * cellSize;
                    const y = r * cellSize;
                    
                    if (cell.walls[0]) { // top
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + cellSize, y);
                        ctx.stroke();
                    }
                    if (cell.walls[1]) { // right
                        ctx.beginPath();
                        ctx.moveTo(x + cellSize, y);
                        ctx.lineTo(x + cellSize, y + cellSize);
                        ctx.stroke();
                    }
                    if (cell.walls[2]) { // bottom
                        ctx.beginPath();
                        ctx.moveTo(x, y + cellSize);
                        ctx.lineTo(x + cellSize, y + cellSize);
                        ctx.stroke();
                    }
                    if (cell.walls[3]) { // left
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x, y + cellSize);
                        ctx.stroke();
                    }
                }
            }
        }
        
        // Remove wall between two cells
        function removeWall(r1, c1, r2, c2) {
            const dr = r2 - r1;
            const dc = c2 - c1;
            
            if (dr === -1) { // moving up
                maze[r1][c1].walls[0] = false;
                maze[r2][c2].walls[2] = false;
            } else if (dr === 1) { // moving down
                maze[r1][c1].walls[2] = false;
                maze[r2][c2].walls[0] = false;
            } else if (dc === -1) { // moving left
                maze[r1][c1].walls[3] = false;
                maze[r2][c2].walls[1] = false;
            } else if (dc === 1) { // moving right
                maze[r1][c1].walls[1] = false;
                maze[r2][c2].walls[3] = false;
            }
        }
        
        // Get unvisited neighbors
        function getNeighbors(r, c) {
            const neighbors = [];
            for (const [dr, dc] of dirs) {
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                    neighbors.push([nr, nc]);
                }
            }
            return neighbors;
        }
        
        // Get accessible neighbors (no wall between)
        function getAccessibleNeighbors(r, c) {
            const neighbors = [];
            const cell = maze[r][c];
            
            // Check each direction
            if (!cell.walls[0] && r > 0) neighbors.push([r - 1, c]); // top
            if (!cell.walls[1] && c < gridSize - 1) neighbors.push([r, c + 1]); // right
            if (!cell.walls[2] && r < gridSize - 1) neighbors.push([r + 1, c]); // bottom
            if (!cell.walls[3] && c > 0) neighbors.push([r, c - 1]); // left
            
            return neighbors;
        }
        
        // Perform random walk until hitting visited cell
        function randomWalk(startR, startC) {
            const path = [[startR, startC]];
            const pathSet = new Set([`${startR},${startC}`]);
            let r = startR, c = startC;
            
            while (!maze[r][c].visited) {
                const neighbors = getNeighbors(r, c);
                const [nr, nc] = neighbors[Math.floor(Math.random() * neighbors.length)];
                
                const key = `${nr},${nc}`;
                
                // If we've looped back, erase the loop
                if (pathSet.has(key)) {
                    while (path.length > 0) {
                        const [pr, pc] = path.pop();
                        pathSet.delete(`${pr},${pc}`);
                        if (pr === nr && pc === nc) {
                            path.push([nr, nc]);
                            pathSet.add(key);
                            break;
                        }
                    }
                } else {
                    path.push([nr, nc]);
                    pathSet.add(key);
                }
                
                r = nr;
                c = nc;
            }
            
            return path;
        }
        
        // Wilson's algorithm with animation
        async function generateWilson() {
            initMaze();
            setupCanvas();
            
            // Mark random cell as visited
            const startR = Math.floor(Math.random() * gridSize);
            const startC = Math.floor(Math.random() * gridSize);
            maze[startR][startC].visited = true;
            
            drawMaze();
            
            // Get list of unvisited cells
            const unvisited = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (!maze[r][c].visited) {
                        unvisited.push([r, c]);
                    }
                }
            }
            
            // Process each unvisited cell
            while (unvisited.length > 0) {
                const idx = Math.floor(Math.random() * unvisited.length);
                const [r, c] = unvisited[idx];
                
                if (maze[r][c].visited) {
                    unvisited.splice(idx, 1);
                    continue;
                }
                
                // Perform random walk
                const path = randomWalk(r, c);
                
                // Animate the walk
                if (animationSpeed > 0) {
                    drawMaze(path);
                    await new Promise(resolve => setTimeout(resolve, animationSpeed));
                }
                
                // Carve the path
                for (let i = 0; i < path.length - 1; i++) {
                    const [r1, c1] = path[i];
                    const [r2, c2] = path[i + 1];
                    removeWall(r1, c1, r2, c2);
                    maze[r1][c1].visited = true;
                }
                
                // Remove newly visited cells from unvisited list
                for (let i = unvisited.length - 1; i >= 0; i--) {
                    const [ur, uc] = unvisited[i];
                    if (maze[ur][uc].visited) {
                        unvisited.splice(i, 1);
                    }
                }
                
                drawMaze();
            }
        }
        
        // A* pathfinding algorithm
        function findPathAStar(startR, startC, endR, endC) {
            const openSet = new Set([`${startR},${startC}`]);
            const cameFrom = new Map();
            const gScore = new Map();
            const fScore = new Map();
            
            gScore.set(`${startR},${startC}`, 0);
            fScore.set(`${startR},${startC}`, heuristic(startR, startC, endR, endC));
            
            while (openSet.size > 0) {
                // Find node with lowest fScore
                let current = null;
                let lowestF = Infinity;
                for (const node of openSet) {
                    const f = fScore.get(node) || Infinity;
                    if (f < lowestF) {
                        lowestF = f;
                        current = node;
                    }
                }
                
                const [r, c] = current.split(',').map(Number);
                
                if (r === endR && c === endC) {
                    return reconstructPath(cameFrom, current);
                }
                
                openSet.delete(current);
                
                const neighbors = getAccessibleNeighbors(r, c);
                for (const [nr, nc] of neighbors) {
                    const neighbor = `${nr},${nc}`;
                    const tentativeG = (gScore.get(current) || Infinity) + 1;
                    
                    if (tentativeG < (gScore.get(neighbor) || Infinity)) {
                        cameFrom.set(neighbor, current);
                        gScore.set(neighbor, tentativeG);
                        fScore.set(neighbor, tentativeG + heuristic(nr, nc, endR, endC));
                        openSet.add(neighbor);
                    }
                }
            }
            
            return null; // No path found
        }
        
        // Dijkstra's algorithm
        function findPathDijkstra(startR, startC, endR, endC) {
            const visited = new Set();
            const distances = new Map();
            const cameFrom = new Map();
            const queue = [[startR, startC, 0]];
            
            distances.set(`${startR},${startC}`, 0);
            
            while (queue.length > 0) {
                queue.sort((a, b) => a[2] - b[2]);
                const [r, c, dist] = queue.shift();
                const current = `${r},${c}`;
                
                if (visited.has(current)) continue;
                visited.add(current);
                
                if (r === endR && c === endC) {
                    return reconstructPath(cameFrom, current);
                }
                
                const neighbors = getAccessibleNeighbors(r, c);
                for (const [nr, nc] of neighbors) {
                    const neighbor = `${nr},${nc}`;
                    if (visited.has(neighbor)) continue;
                    
                    const newDist = dist + 1;
                    if (newDist < (distances.get(neighbor) || Infinity)) {
                        distances.set(neighbor, newDist);
                        cameFrom.set(neighbor, current);
                        queue.push([nr, nc, newDist]);
                    }
                }
            }
            
            return null;
        }
        
        // BFS pathfinding
        function findPathBFS(startR, startC, endR, endC) {
            const visited = new Set();
            const queue = [[startR, startC]];
            const cameFrom = new Map();
            
            visited.add(`${startR},${startC}`);
            
            while (queue.length > 0) {
                const [r, c] = queue.shift();
                
                if (r === endR && c === endC) {
                    return reconstructPath(cameFrom, `${r},${c}`);
                }
                
                const neighbors = getAccessibleNeighbors(r, c);
                for (const [nr, nc] of neighbors) {
                    const neighbor = `${nr},${nc}`;
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        cameFrom.set(neighbor, `${r},${c}`);
                        queue.push([nr, nc]);
                    }
                }
            }
            
            return null;
        }
        
        // Heuristic function (Manhattan distance)
        function heuristic(r1, c1, r2, c2) {
            return Math.abs(r1 - r2) + Math.abs(c1 - c2);
        }
        
        // Reconstruct path from cameFrom map
        function reconstructPath(cameFrom, current) {
            const path = [];
            while (current) {
                const [r, c] = current.split(',').map(Number);
                path.unshift([r, c]);
                current = cameFrom.get(current);
            }
            return path;
        }
        
        // Find path using selected algorithm
        function findPath() {
            if (!entrance || !exit) {
                alert('Please set both entrance and exit points first!');
                return;
            }
            
            const algorithm = document.getElementById('algorithm').value;
            let path = null;
            
            if (algorithm === 'astar') {
                path = findPathAStar(entrance.r, entrance.c, exit.r, exit.c);
            } else if (algorithm === 'dijkstra') {
                path = findPathDijkstra(entrance.r, entrance.c, exit.r, exit.c);
            } else if (algorithm === 'bfs') {
                path = findPathBFS(entrance.r, entrance.c, exit.r, exit.c);
            }
            
            if (path) {
                solutionPath = path;
                drawMaze();
            } else {
                alert('No path found between entrance and exit!');
            }
        }
        
        // Export maze as matrix
        function exportMatrix() {
            // Create a matrix where 0 = path, 1 = wall
            const matrixSize = gridSize * 2 + 1;
            const matrix = Array(matrixSize).fill().map(() => Array(matrixSize).fill(1));
            
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const mr = r * 2 + 1;
                    const mc = c * 2 + 1;
                    matrix[mr][mc] = 0; // cell itself
                    
                    const cell = maze[r][c];
                    if (!cell.walls[0]) matrix[mr - 1][mc] = 0; // top
                    if (!cell.walls[1]) matrix[mr][mc + 1] = 0; // right
                    if (!cell.walls[2]) matrix[mr + 1][mc] = 0; // bottom
                    if (!cell.walls[3]) matrix[mr][mc - 1] = 0; // left
                }
            }
            
            const text = matrix.map(row => row.join(' ')).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'maze_matrix.txt';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Update mode indicator
        function updateModeIndicator() {
            const indicator = document.getElementById('modeIndicator');
            if (settingMode === 'entrance') {
                indicator.textContent = 'Click to set entrance point';
                indicator.classList.add('active');
            } else if (settingMode === 'exit') {
                indicator.textContent = 'Click to set exit point';
                indicator.classList.add('active');
            } else {
                indicator.textContent = 'Click on maze to set points';
                indicator.classList.remove('active');
            }
        }
        
        // Canvas click handler
        canvas.addEventListener('click', (e) => {
            if (maze.length === 0) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const c = Math.floor(x / cellSize);
            const r = Math.floor(y / cellSize);
            
            if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                if (settingMode === 'entrance') {
                    entrance = { r, c };
                    settingMode = null;
                    updateModeIndicator();
                    solutionPath = [];
                    drawMaze();
                } else if (settingMode === 'exit') {
                    exit = { r, c };
                    settingMode = null;
                    updateModeIndicator();
                    solutionPath = [];
                    drawMaze();
                }
            }
        });
        
        // Event listeners
        document.getElementById('generateBtn').addEventListener('click', async () => {
            if (isGenerating) return;
            isGenerating = true;
            document.getElementById('generateBtn').disabled = true;
            await generateWilson();
            isGenerating = false;
            document.getElementById('generateBtn').disabled = false;
        });
        
        document.getElementById('setEntranceBtn').addEventListener('click', () => {
            settingMode = 'entrance';
            updateModeIndicator();
        });
        
        document.getElementById('setExitBtn').addEventListener('click', () => {
            settingMode = 'exit';
            updateModeIndicator();
        });
        
        document.getElementById('clearPointsBtn').addEventListener('click', () => {
            entrance = null;
            exit = null;
            solutionPath = [];
            settingMode = null;
            updateModeIndicator();
            drawMaze();
        });
        
        document.getElementById('findPathBtn').addEventListener('click', () => {
            findPath();
        });
        
        document.getElementById('clearPathBtn').addEventListener('click', () => {
            solutionPath = [];
            drawMaze();
        });
        
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (maze.length === 0) {
                alert('Generate a maze first!');
                return;
            }
            exportMatrix();
        });
        
        document.getElementById('gridSize').addEventListener('change', (e) => {
            gridSize = parseInt(e.target.value);
        });
        
        document.getElementById('cellSize').addEventListener('input', (e) => {
            cellSize = parseInt(e.target.value);
            document.getElementById('cellSizeValue').textContent = cellSize;
        });
        
        document.getElementById('speed').addEventListener('change', (e) => {
            animationSpeed = parseInt(e.target.value);
        });
        
        document.getElementById('wallColor').addEventListener('change', (e) => {
            wallColor = e.target.value;
            drawMaze();
        });
        
        document.getElementById('pathColor').addEventListener('change', (e) => {
            pathColor = e.target.value;
            drawMaze();
        });
        
        document.getElementById('currentColor').addEventListener('change', (e) => {
            currentColor = e.target.value;
        });
        
        document.getElementById('solutionColor').addEventListener('change', (e) => {
            solutionColor = e.target.value;
            drawMaze();
        });
        
        document.getElementById('entranceColor').addEventListener('change', (e) => {
            entranceColor = e.target.value;
            drawMaze();
        });
        
        document.getElementById('exitColor').addEventListener('change', (e) => {
            exitColor = e.target.value;
            drawMaze();
        });
        
        // Initialize
        initMaze();
        setupCanvas();
        drawMaze();
        updateModeIndicator();
    </script>
</body>
</html>
