<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Extended Euclidean Algorithm</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
    input[type="number"] {
      width: 100px;
      padding: 5px;
    }
  </style>
</head>
<body>

  <h1>Extended Euclidean Algorithm (EGCD)</h1>

  <label for="a">Enter a: </label>
  <input type="number" id="a" required>
  <label for="b">Enter b: </label>
  <input type="number" id="b" required>
  <button onclick="runEGCD()">Compute EGCD</button>

  <div id="result"></div>

  <script>
    function runEGCD() {
      const a = parseInt(document.getElementById('a').value);
      const b = parseInt(document.getElementById('b').value);
      if (isNaN(a) || isNaN(b)) {
        alert("Please enter valid integers.");
        return;
      }

      let r1 = a, r2 = b;
      let s1 = 1, s2 = 0;
      let t1 = 0, t2 = 1;

      let tableRows = [];

      while (r2 !== 0) {
        const q = Math.floor(r1 / r2);
        const r = r1 - q * r2;
        const s = s1 - q * s2;
        const t = t1 - q * t2;

        tableRows.push({ q, r1, r2, r, s1, s2, s, t1, t2, t });

        // Update for next iteration
        r1 = r2;
        r2 = r;
        s1 = s2;
        s2 = s;
        t1 = t2;
        t2 = t;
      }

      // Generate HTML table
      let html = `
        <h2>Steps:</h2>
        <table>
          <tr>
            <th>q</th>
            <th>r1</th>
            <th>r2</th>
            <th>r</th>
            <th>s1</th>
            <th>s2</th>
            <th>s</th>
            <th>t1</th>
            <th>t2</th>
            <th>t</th>
          </tr>
      `;

      for (const row of tableRows) {
        html += `
          <tr>
            <td>${row.q}</td>
            <td>${row.r1}</td>
            <td>${row.r2}</td>
            <td>${row.r}</td>
            <td>${row.s1}</td>
            <td>${row.s2}</td>
            <td>${row.s}</td>
            <td>${row.t1}</td>
            <td>${row.t2}</td>
            <td>${row.t}</td>
          </tr>
        `;
      }

      html += `</table>`;

      html += `<p><strong>GCD(${a}, ${b}) = ${r1}</strong></p>`;
      html += `<p><strong>Coefficients:</strong> s = ${s1}, t = ${t1}</p>`;
      html += `<p><strong>Check:</strong> ${a} * (${s1}) + ${b} * (${t1}) = ${a*s1 + b*t1}</p>`;

      document.getElementById('result').innerHTML = html;
    }
  </script>
  <center><span>By Mr Techtroid (mtt.one)</span></center>

</body>
</html>
